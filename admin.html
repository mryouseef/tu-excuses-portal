<script>
        // 1. تعقيم البيانات الوهمية (لحماية أسماء الفريق الإداري وأرقام الطلاب)
        const mockData = [
            { id: "44100001", name: "طالب تجريبي 1", course: "مبادئ الإدارة", reviewer: "عضو هيئة تدريس أ", status: "admin_review", statusText: "فرز إداري (المركز)", badge: "bg-warning" },
            { id: "44100002", name: "طالب تجريبي 2", course: "المحاسبة المالية", reviewer: "عضو هيئة تدريس ب", status: "academic_review", statusText: "بانتظار الاعتماد", badge: "bg-info" },
            { id: "44100003", name: "طالب تجريبي 3", course: "السلوك التنظيمي", reviewer: "عضو هيئة تدريس ج", status: "approved", statusText: "معتمد نهائياً", badge: "bg-success" },
            { id: "44100004", name: "طالب تجريبي 4", course: "نظم المعلومات", reviewer: "عضو هيئة تدريس د", status: "appeal", statusText: "يوجد تظلم مرفوع", badge: "bg-danger" },
            { id: "44100005", name: "طالب تجريبي 5", course: "مبادئ الإدارة", reviewer: "عضو هيئة تدريس أ", status: "admin_review", statusText: "فرز إداري (المركز)", badge: "bg-warning" }
        ];

        // 2. دالة لتعقيم النصوص وحماية النظام من ثغرات XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // 3. تجهيز دالة تسجيل الدخول للربط بالخادم
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('email-error');

            // --- مسودة برمجية للنسخة النهائية (لا تعمل الآن بدون خادم) ---
            /*
            try {
                const response = await fetch('https://api.your-backend.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if(data.token) {
                    // حفظ التوكن وفتح النظام
                }
            } catch (error) { ... }
            */
            // -------------------------------------------------------------

            // محاكاة تسجيل الدخول للنسخة التجريبية الحالية
            if (email.includes('@tu.edu.sa') && password.length >= 6) {
                errorMsg.style.display = 'none';
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                renderTable('all');
            } else {
                errorMsg.innerText = "الرجاء إدخال بريد جامعي صحيح وكلمة مرور صالحة.";
                errorMsg.style.display = 'block';
            }
        }

        function logout() {
            // في النسخة النهائية يجب مسح الـ Token هنا
            document.getElementById('app-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'flex';
            
            // مسح الحقول
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        function switchPage(filterStatus, pageTitle, clickedElement) {
            document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
            clickedElement.classList.add('active');
            document.getElementById('page-main-title').innerText = pageTitle;

            const statsContainer = document.getElementById('stats-container');
            const tableTitle = document.getElementById('table-title');
            
            if(filterStatus === 'all') {
                statsContainer.style.display = 'grid';
                tableTitle.innerText = 'سجل جميع الطلبات';
            } else {
                statsContainer.style.display = 'none';
                tableTitle.innerText = 'الطلبات المفلترة: ' + pageTitle;
            }
            renderTable(filterStatus);
        }

        function renderTable(filter) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const filteredData = filter === 'all' ? mockData : mockData.filter(row => row.status === filter);

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px; color: gray; font-weight:bold;">لا توجد طلبات في هذا القسم حالياً.</td></tr>`;
                return;
            }

            filteredData.forEach(row => {
                // استخدام دالة التعقيم قبل الطباعة
                const safeName = escapeHTML(row.name);
                const safeId = escapeHTML(row.id);
                const safeCourse = escapeHTML(row.course);
                const safeReviewer = escapeHTML(row.reviewer);

                let actionButtons = `<button class="btn-view" onclick="openSecureViewer('${safeId}', '${safeName}')" title="عرض المرفق الآمن"><i class="fa-solid fa-eye"></i> فتح الملف</button>`;
                
                if (row.status === 'appeal') {
                    actionButtons += `<button class="btn-appeal" onclick="alert('فتح ملف التظلم وإعادة التقييم')" title="مراجعة التظلم"><i class="fa-solid fa-scale-balanced"></i> لجنة الأعذار</button>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${safeName}</strong><br><span style="color:gray; font-size:0.85rem;">${safeId}</span></td>
                        <td>${safeCourse}<br><span style="color:var(--primary); font-size:0.85rem; font-weight:bold;">${safeReviewer}</span></td>
                        <td><span class="badge ${row.badge}">${row.statusText}</span></td>
                        <td class="action-btns">${actionButtons}</td>
                    </tr>
                `;
            });
        }

        function openSecureViewer(studentId, studentName) {
            document.getElementById('modal-title').innerText = `المستند الآمن - الطالب: ${studentName} (${studentId})`;
            document.getElementById('pdf-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('pdf-modal').style.display = 'none';
        }

        function triggerAction(decision) {
            alert(`تم تسجيل قرار الـ ${decision} وسيتم تحديث حالة الطلب.`);
            closeModal();
        }
    </script>
